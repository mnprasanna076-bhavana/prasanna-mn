<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <i class="fa-solid fa-wallet"></i> PocketSmart
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/register" class="btn-nav-primary">Create Account</a></li>
    </ul>
  </nav>

  <!-- Login Main -->
  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-brand">PocketSmart</h1>
        <p class="auth-subbrand">AI-Powered Budget Planning</p>
        <h2 class="auth-title">Welcome Back</h2>
      </div>

      <div id="alert-box" style="display: none; padding: 0.75rem; border-radius: 8px; margin-bottom: 1.2rem; font-size: 0.9rem;"></div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>
        </div>

        <div style="text-align: right; margin-top: -0.4rem;">
          <a href="#" onclick="alert('Please contact your administrator or register a new account.'); return false;" style="font-size: 0.85rem; color: #2563eb; text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-card-action" style="padding: 0.85rem; font-size: 1rem; width: 100%; margin-top: 0.8rem;">
          Sign In <i class="fa-solid fa-arrow-right" style="margin-left: 0.3rem;"></i>
        </button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="/register">Create Account</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2025 PocketSmart. All rights reserved.BY LILY</p>
    </div>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById("alert-box");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      alertBox.style.display = "none";

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.access_token) {
            localStorage.setItem("access_token", data.access_token);
            localStorage.setItem("username", data.username || username);
          }
          alertBox.style.display = "block";
          alertBox.style.backgroundColor = "#dcfce7";
          alertBox.style.color = "#166534";
          alertBox.innerText = "Login successful! Redirecting to dashboard...";
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 400);
        } else {
          alertBox.style.display = "block";
          alertBox.style.backgroundColor = "#fee2e2";
          alertBox.style.color = "#991b1b";
          alertBox.innerText = data.detail || "Invalid username or password";
        }
      } catch (err) {
        alertBox.style.display = "block";
        alertBox.style.backgroundColor = "#fee2e2";
        alertBox.style.color = "#991b1b";
        alertBox.innerText = "Server connection failed. Please ensure the backend is running.";
      }
    });
  </script>
</body>
</html>
